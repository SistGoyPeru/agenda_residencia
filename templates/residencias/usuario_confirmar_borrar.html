{% extends "base.html" %}
{% block title %}Borrar {{ usuario.username }}{% endblock %}
{% block content %}
<h2 class="seccion-titulo">Borrar usuario</h2>
<div class="tarjeta">
  <p>¿Estás seguro de que quieres borrar el usuario <strong>{{ usuario.username }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post" style="margin-top:1rem;">
    {% csrf_token %}
    <button class="boton peligro" type="submit">Sí, borrar</button>
    <a href="{% url 'usuarios' %}" class="boton fantasma">Cancelar</a>
  </form>
</div>
{% endblock %}
