{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="tarjeta" style="max-width: 400px; margin: 2rem auto;">
  {% if user.perfil.logo %}
    <img src="{% url 'mi_logo' %}?v={{ user.perfil.logo_actualizado|date:'U' }}" class="marca-logo" alt="" style="display:block;margin:0 auto 1rem auto;">
  {% else %}
    <div class="marca-icono" style="margin: 0 auto 1rem auto; width: 56px; height: 56px; font-size: 2rem;">&#128197;</div>
  {% endif %}
  <h2 style="text-align:center; margin-bottom: 1.2rem;">Entrar</h2>
  <form method="post">
    {% csrf_token %}
    <div class="campo">
      <label>Usuario</label>
      <input type="text" name="username" autofocus required>
    </div>
    <div class="campo">
      <label>Contraseña</label>
      <input type="password" name="password" required>
    </div>
    <button class="boton primario bloque" type="submit">Ingresar</button>
  </form>
  <p style="text-align:center; margin-top: 1rem; font-size: 0.9rem; color: #6b7a72;">
    ¿No tienes cuenta? Pídele al administrador que te cree una.
  </p>
</div>
{% endblock %}
