{% extends "base.html" %}
{% block title %}Borrar visita{% endblock %}
{% block content %}
<h2 class="seccion-titulo">Borrar visita</h2>
<div class="tarjeta">
  <p>¿Estás seguro de que quieres borrar la visita a <strong>{{ visita.residencia.nombre }}</strong> del {{ visita.fecha|date:"d/m/Y" }}?</p>
  <form method="post" style="margin-top:1rem;">
    {% csrf_token %}
    <button class="boton peligro" type="submit">Sí, borrar</button>
    <a href="{% url 'visita_detalle' visita.pk %}" class="boton fantasma">Cancelar</a>
  </form>
</div>
{% endblock %}
