{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Cambiar contraseña · Ruta Residencias</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=6">
</head>
<body class="auth-body">
  <main class="auth-caja">
    <h1>Cambiar contraseña</h1>
    <p class="auth-sub">Actualiza tu contraseña de acceso.</p>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div class="aviso-flash error">Revisa los datos.</div>
      {% endif %}
      {% for field in form %}
        <div class="campo-grupo">
          <label class="campo-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
      <button class="boton boton-primario boton-bloque" type="submit">Guardar</button>
    </form>
    <p class="ayuda mt-14" style="text-align:center">
      <a href="{% url 'dashboard' %}">Volver</a>
    </p>
  </main>
</body>
</html>
